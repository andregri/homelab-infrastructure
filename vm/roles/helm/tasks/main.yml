---
# tasks file for roles/helm
- name: Download Helm v4.2.3
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
    checksum: sha256:https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz.sha256sum
    dest: /opt/helm-v4.2.3-linux-amd64.tar.gz

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: /opt/helm-v4.2.3-linux-amd64.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    remote_src: true
    mode: '0755'