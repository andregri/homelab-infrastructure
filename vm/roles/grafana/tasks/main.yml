---
# tasks file for grafana
- name: Install required system packages
  apt:
    pkg:
      - adduser
      - libfontconfig1
      - musl
    state: latest
    update_cache: true

- name: Download .deb package
  ansible.builtin.get_url:
    url: https://dl.grafana.com/oss/release/grafana_10.2.2_amd64.deb
    dest: /opt/grafana_10.2.2_amd64.deb

- name: Install .deb package
  ansible.builtin.apt:
    deb: /opt/grafana_10.2.2_amd64.deb

- name: create /var/lib/grafana/dashboards
  file:
    state: directory
    path: /var/lib/grafana/dashboards
    recurse: true
    mode: 0755

- name: Provision dashboards
  copy:
    src: dashboards.yaml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yaml

- name: Provision node exporter dashboard
  copy:
    src: node-exporter-full-dashboard.json
    dest: /var/lib/grafana/dashboards/node-exporter-full-dashboard.json

- name: Provision loki dashboard
  copy:
    src: loki-dashboard.json
    dest: /var/lib/grafana/dashboards/loki-dashboard.json

- name: Provision prometheus datasource
  copy:
    src: prometheus.yaml
    dest: /etc/grafana/provisioning/datasources/prometheus.yaml

- name: Provision loki datasource
  copy:
    src: loki.yaml
    dest: /etc/grafana/provisioning/datasources/loki.yaml

- name: Start Grafana server with systemd
  ansible.builtin.systemd_service:
    state: restarted
    name: grafana-server
    daemon_reload: true
    enabled: true

- name: Allow all access to tcp port 3000
  community.general.ufw:
    rule: allow
    port: '3000'
    proto: tcp

- name: Get Grafana admin password
  ansible.builtin.shell:
    cmd: "grep admin_password /etc/grafana/grafana.ini"
  become: true
  register: grafana_password
  changed_when: false

- name: Print Grafana admin password
  ansible.builtin.debug:
    var: grafana_password.stdout